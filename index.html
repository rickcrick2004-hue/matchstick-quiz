<script>
'use strict';
(()=>{
const STORE='match-stick-quiz-v1';
const DIGITS={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};

['1','+','1','3',1,'1','+','1','2'],['2','+','1','2',1,'2','+','1','3'],
['3','+','1','6',1,'5','+','1','6'],['4','+','1','3',1,'4','+','1','5'],
['1','+','6','5',1,'1','+','5','6'],['1','+','1','6',1,'7','-','1','6'],
['1','-','4','6',1,'1','+','4','5'],['0','+','1','8',1,'8','+','1','9'],
['2','+','7','4',2,'2','+','1','3'],['3','+','4','8',2,'3','+','3','6'],
['5','+','9','1',2,'5','+','2','7'],['1','-','9','9',2,'1','+','5','6'],
['14','+','9','35',2,'14','+','9','23'],['24','+','4','25',2,'24','-','4','20'],
['22','+','8','68',2,'62','+','6','68'],['30','+','9','28',2,'36','-','8','28'],
['41','+','3','67',3,'44','+','3','47'],['42','-','1','23',3,'42','+','1','43'],
['27','+','3','16',3,'24','-','9','15'],['32','+','4','66',3,'62','-','4','58']
];
const HINTS=[
'答えの数字に注目してみよう。','右側の数字を変えてみよう。','左端の数字が変わるかも。','右端の数字に注目してみよう。',
'同じ棒を、別の数字に渡せないかな？','「＋」を動かしてみると……？','計算記号も変えられるよ。','左端と右端を見比べてみよう。',
'真ん中の数字と答えの数字を見よう。','真ん中と右端の数字がポイント。','数字の形を2か所変えよう。','「－」もマッチ棒でできているよ。',
'右側の2桁に注目しよう。','記号と答えの数字がポイント。','左端の数字にも注目してみよう。','真ん中の数字と記号を見比べよう。',
'左辺だけでなく答えの2桁にも注目。','真ん中の記号を変えられるかな？','数字と記号をまとめて見直そう。','2桁の数字と記号を広く見よう。'
];
const LEVELS=[{name:'はじめてのマッチ棒',tag:'ひよこ級',color:'#57c4a7',emoji:'🐣'},{name:'ひらめきチャレンジャー',tag:'チャレンジャー級',color:'#65a8eb',emoji:'🌱'},{name:'マッチ棒名人',tag:'名人級',color:'#e9b351',emoji:'⚡'},{name:'マッチ棒博士',tag:'博士級',color:'#ed9666',emoji:'🧠'},{name:'マッチ棒マスター',tag:'マスター級',color:'#a781e8',emoji:'👑'}];

const el=document.getElementById('app'), mod=document.getElementById('modal-root'),toastEl=document.getElementById('toast');
const saved=(()=>{try{return JSON.parse(localStorage.getItem(STORE))||{}}catch{return {}}})();

const state={screen:'home',mode:'challenge',timeChoice:[60,180,0].includes(saved.timeChoice)?saved.timeChoice:60,idx:0,filter:'all',onlyMissing:false,challengeCursor:progress,bestStars,history:[],pending:null,hints:0,started:false,deadline:null,remaining:60,roundTime:60,phase:'ready',teacher:false,teacherOpen:false,modal:null,sound:saved.sound!==false,reduceMotion:saved.reduceMotion===true,current:{},tokens:[],notice:'',lastSolvedStars:0,animationId:0,animating:false,consecutive:0};
let soundCtx=null, interval=null,toastTimeout=null;

function allKeys(obj){const keys=new Set;for(let [id,s] of Object.entries(obj))for(let seg of s)keys.add(id+'|'+seg);return keys}

function selfTest(){return puzzles.every(p=>{const a=makeInitial(p),b=buildAnswer(p),d=difference(a,b);return d.from.length===p.moves&&d.to.length===p.moves&&(Number(p.solution.a)+(p.solution.op==='+'?Number(p.solution.b):-Number(p.solution.b)))===Number(p.solution.c)})}

 try{const AudioC=window.AudioContext||window.webkitAudioContext;if(!AudioC)return;if(!soundCtx)soundCtx=new AudioC();if(soundCtx.state==='suspended')soundCtx.resume().catch(()=>{});const tunes=kind==='win'?[[523,0],[659,.11],[784,.23],[1046,.37]]:kind==='level'?[[392,0],[523,.12],[659,.24],[784,.37],[1046,.51]]:kind==='bad'?[[300,0],[260,.1]]:[[690,0]];

 }catch(e){console.debug('音声再生できません',e)}
}

function parseGroup(prefix,txt){let out='';for(let i=0;i<txt.length;i++){const s=state.current[prefix+i];const v=Object.keys(DIGITS).find(d=>bits(d).length===s.size&&bits(d).every(k=>s.has(k)));if(v===undefined)return {ok:false};out+=v}if(out.length>1&&out[0]==='0')return {ok:false};return {ok:true,value:Number(out),text:out}}

function handleSegment(id,key){if(state.screen!=='game'||state.phase!=='playing'||state.animating)return;if(id==='eq')return;const s=state.current[id];if(!s)return;const pressed=id+'|'+key;const exists=s.has(key);if(!state.pending){if(!exists){notify('まず動かしたいマッチ棒をタップ！');return}if(state.history.length>=puzzles[state.idx].moves){notify('指定本数まで動かしました。答えをチェックするか、1つ戻そう！');return}state.pending=pressed;render();return}

${isReveal?`<div class="feedback fail"><h3>${state.phase==='revealing'?'✨ 答えをアニメーションで確認中…':'👀 解答例はこちら！'}</h3><p>${showOutcomeFormula()}</p><p>答えを見た問題も、再挑戦して星をゲットできるよ！</p></div><div class="action-area"><button class="warm" data-action="retry" ${state.animating?'disabled':''}>🔁 自分で挑戦</button><button class="ghost" data-action="skip" ${state.animating?'disabled':''}>次へ →</button></div>`:''}
</div>
${state.teacher?`<div class="teacher-bar"><h3>📽 先生用操作パネル</h3><div class="teacher-grid"><button class="ghost" data-action="previous">◀ 前の問題</button><button class="ghost" data-action="teacher-pick">☰ 問題選択</button><button class="ghost" data-action="teacher-next">次の問題 ▶</button><button class="ghost" data-action="reveal">👀 解答アニメ</button><button class="ghost" data-action="${isPaused?'resume':'pause'}" ${(!isPlaying&&!isPaused)?'disabled':''}>${isPaused?'▶ タイマー再開':'⏸ 一時停止'}</button><button class="ghost" data-action="retry">🔄 問題リセット</button><button class="ghost" data-action="fullscreen">⛶ 全画面</button><button class="ghost" data-action="toggle-sound">${state.sound?'🔊 音をOFF':'🔇 音をON'}</button><button class="ghost" data-action="exit-teacher">✕ 先生モード終了</button></div></div>`:''}
<div class="footer-note">別解もOK！指定本数を動かして、計算式が正しければクリアです。</div>`}
function results(){let solved=state.bestStars.filter(Boolean).length,stars=state.bestStars.reduce((a,b)=>a+b,0),missing=puzzles.filter(p=>!state.bestStars[p.i]);return `<div class="section-header"><div><h2>🏁 チャレンジ結果</h2><p class="page-intro">20問への挑戦、おつかれさま！</p></div></div><div class="panel"><div class="result-hero"><div style="font-size:56px">${solved===20?'👑':'🎉'}</div><h2>${solved===20?'完全クリア！':'20問に挑戦したね！'}</h2><p>ひらめいた数だけ、君の力になる！</p><div class="result-number">${solved} / 20</div><div>クリアした問題</div></div><div class="result-grid"><div class="result-box"><div class="big">${solved}</div><div class="caption">クリア数</div></div><div class="result-box"><div class="big">${stars}</div><div class="caption">獲得した星</div></div><div class="result-box"><div class="big">${20-solved}</div><div class="caption">未クリア問題</div></div></div><p class="page-intro" style="text-align:center">${missing.length?'未クリアの問題は、自由練習モードから何度でも挑戦できます。':'すべての問題をクリア！おめでとう！'}</p><div class="setting-actions"><button class="warm" data-action="retry-missing">🎯 未クリアに再挑戦</button><button class="secondary" data-action="restart-challenge">🔄 1問目から再スタート</button><button class="ghost" data-action="home">🏠 ホームへ</button></div></div>`}
function render(){el.innerHTML=`<main class="shell ${state.teacher?'teacher-view':''}">${header()}${state.screen==='home'?home():state.screen==='time'?timePick():state.screen==='free'?freeSelect():state.screen==='game'?game():results()}</main>`;renderModal()}
function renderModal(){if(!state.modal){mod.replaceChildren();return}let x='',title='';if(state.modal==='rules'){title='📖 あそびかた';x=`<ol><li>マッチ棒を動かして、まちがった計算式を正しくしよう。</li><li>動かしたいマッチ棒をタップ。次に、置きたい場所の点線をタップ！</li><li>指定された本数だけ動かして「答えをチェック！」を押そう。</li><li>「＋」「－」は変えてもOK。「＝」は固定だよ。</li><li>模範解答以外でも、ルールどおりなら正解！</li></ol><p>チャレンジモードはスキップ可能。時間切れになっても何度でも再挑戦できます。</p>`}
else if(state.modal==='settings'){title='⚙️ 設定';x=`<label class="choice"><strong>🔊 効果音を鳴らす</strong><input type="checkbox" data-setting="sound" ${state.sound?'checked':''}></label><label class="choice"><strong>✨ アニメーション・紙吹雪を使う</strong><input type="checkbox" data-setting="motion" ${!state.reduceMotion?'checked':''}></label><div style="margin:18px 0 10px"><label for="time-setting" style="font-weight:1000">⏱ 1問の制限時間</label><select id="time-setting" class="select-choice" data-setting="time"><option value="60" ${state.timeChoice===60?'selected':''}>1分</option><option value="180" ${state.timeChoice===180?'selected':''}>3分</option><option value="0" ${state.timeChoice===0?'selected':''}>無制限</option></select></div><p class="tiny">※ 開始前はすぐ反映され、プレイ中は次の挑戦から反映されます。記録は現在のブラウザーに保存されます。</p>`}
else if(state.modal==='teacher-pick'){title='📽 出題する問題を選択';x=`<div class="problem-grid">${puzzles.map(p=>`<button class="problem-tile" data-action="pick-teacher" data-index="${p.i}"><span class="num">${p.i+1}</span><span class="formula">${esc(formatPuzzle(p))}</span></button>`).join('')}</div>`}
else if(state.modal==='teacher-confirm'){title='📽 先生用モード';x=`<p>全画面で問題を出したり、タイマーの一時停止や解答アニメーションを操作できます。</p><p>パスワードはなく、同じ画面を見ている生徒にも操作内容が表示されます。</p><div class="setting-actions"><button class="primary" data-action="enter-teacher">先生用モードを開く</button></div>`}
mod.innerHTML=`<div class="modal-scrim" data-action="dismiss-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="close-row"><h2>${title}</h2><button class="icon-btn" data-action="dismiss-modal" aria-label="閉じる">✕</button></div>${x}</div></div>`}
function changeTime(v){state.timeChoice=[0,60,180].includes(v)?v:60;save();render()}
function skip(){if(state.animating)return;state.consecutive=0;if(state.mode==='challenge'){advance()}else if(state.teacher){initPuzzle((state.idx+1)%20,'free');state.teacher=true;render()}else setScreen('free')}
function handleAction(target){let action=target.dataset.action;if(!action)return;switch(action){case'home':toHome();break;case'rules':state.modal='rules';renderModal();break;case'settings':state.modal='settings';renderModal();break;case'teacher':case'teacher-home':state.modal='teacher-confirm';renderModal();break;case'enter-teacher':state.modal=null;state.teacher=true;if(state.screen!=='game')initPuzzle(0,'free');else{state.mode='free';stopTick();state.phase='ready';state.started=false;state.deadline=null;state.roundTime=state.timeChoice;state.remaining=state.roundTime;state.current=makeInitial(puzzles[state.idx]);state.history=[];state.pending=null;render()}break;case'exit-teacher':state.teacher=false;state.teacherOpen=false;render();break;case'dismiss-modal':state.modal=null;render();break;case'choose':state.mode=target.dataset.mode==='free'?'free':'challenge';state.screen='time';render();break;case'time':changeTime(Number(target.dataset.time));break;case'proceed':state.mode==='challenge'?(state.challengeCursor>=20?setScreen('results'):initPuzzle(state.challengeCursor,'challenge')):setScreen('free');break;case'back':setScreen('home');break;case'filter':state.filter=target.dataset.filter;render();break;case'missing':state.onlyMissing=!state.onlyMissing;render();break;case'open-problem':initPuzzle(Number(target.dataset.index),'free');break;case'random':{const ps=puzzles.filter(p=>(state.filter==='all'||p.level===Number(state.filter))&&(!state.onlyMissing||!state.bestStars[p.i]));if(!ps.length){notify('選べる問題がありません。');break}initPuzzle(ps[Math.floor(Math.random()*ps.length)].i,'free');break}
case'start':beginTimer();break;case'check':checkAnswer();break;case'undo':undo();break;case'reset':resetBoard();break;case'hint':hint();break;case'pause':pauseTimer();break;case'resume':resumeTimer();break;case'retry':initPuzzle(state.idx,state.mode);break;case'skip':skip();break;case'next':advance();break;case'reveal':animateReveal();break;case'previous':initPuzzle((state.idx+19)%20,'free');state.teacher=true;render();break;case'teacher-next':initPuzzle((state.idx+1)%20,'free');state.teacher=true;render();break;case'teacher-pick':state.modal='teacher-pick';renderModal();break;case'pick-teacher':state.modal=null;initPuzzle(Number(target.dataset.index),'free');state.teacher=true;render();break;case'toggle-sound':state.sound=!state.sound;save();render();break;case'fullscreen':toggleFullscreen();break;case'retry-missing':state.mode='free';state.filter='all';state.onlyMissing=true;setScreen('free');break;case'restart-challenge':state.challengeCursor=0;save();initPuzzle(0,'challenge');break;default:break}}
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else notify('このブラウザーでは全画面表示に対応していません。')}catch{notify('全画面表示を開始できませんでした。')}}
function screenPoint(svg,x,y){let pt=svg.createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(svg.getScreenCTM())}
function segmentGeometry(token,seg){let svg=document.querySelector(`svg[data-token-svg="${token}"]`),coords=SEG[seg];if(!svg||!coords)return null;let a=screenPoint(svg,coords[0],coords[1]),b=screenPoint(svg,coords[2],coords[3]);return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,length:Math.hypot(b.x-a.x,b.y-a.y),angle:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}}
function fly(from,to,milliseconds,animationId){return new Promise(resolve=>{if(state.animationId!==animationId){resolve();return}const start=segmentGeometry(...from.split('|')),end=segmentGeometry(...to.split('|'));if(!start||!end||state.reduceMotion){setTimeout(resolve,50);return}const flight=document.createElement('div');flight.className='flying-match';flight.style.width=start.length+'px';flight.style.left=start.x+'px';flight.style.top=start.y+'px';document.getElementById('flight-layer').appendChild(flight);let animation=flight.animate([{left:start.x+'px',top:start.y+'px',width:start.length+'px',transform:`translate(-50%,-50%) rotate(${start.angle}deg)`},{left:end.x+'px',top:end.y+'px',width:end.length+'px',transform:`translate(-50%,-50%) rotate(${end.angle}deg)`}],{duration:milliseconds,easing:'ease-in-out',fill:'forwards'});animation.onfinish=()=>{flight.remove();resolve()};animation.oncancel=()=>{flight.remove();resolve()};setTimeout(()=>{if(flight.isConnected){flight.remove();resolve()}},milliseconds+180)})}
async function animateReveal(){if(state.screen!=='game'||state.animating)return;stopTick();const aid=++state.animationId;state.started=false;state.deadline=null;state.phase='revealing';state.pending=null;state.history=[];state.current=makeInitial(puzzles[state.idx]);state.animating=true;render();const changes=difference(makeInitial(puzzles[state.idx]),buildAnswer(puzzles[state.idx]));for(let i=0;i<changes.from.length;i++){if(aid!==state.animationId)return;const from=changes.from[i],to=changes.to[i];const [sid,skey]=from.split('|'),[did,dkey]=to.split('|');const moveDuration=state.reduceMotion?50:560;let moving=fly(from,to,moveDuration,aid);state.current[sid].delete(skey);render();await moving;if(aid!==state.animationId)return;state.current[did].add(dkey);render();await new Promise(r=>setTimeout(r,state.reduceMotion?10:160))}if(aid!==state.animationId)return;state.animating=false;state.phase='revealed';render()}
mod.addEventListener('click',e=>{if(e.target.classList.contains('modal-scrim')){state.modal=null;renderModal();return}let button=e.target.closest('[data-action]');if(button)handleAction(button)});
mod.addEventListener('change',e=>{let name=e.target.dataset.setting;if(name==='sound'){state.sound=e.target.checked;save()}else if(name==='motion'){state.reduceMotion=!e.target.checked;save()}else if(name==='time'){state.timeChoice=Number(e.target.value);if(state.screen==='game'&&state.phase==='ready'){state.roundTime=state.timeChoice;state.remaining=state.roundTime}save()}});
el.addEventListener('click',e=>{const act=e.target.closest('[data-action]');if(act){handleAction(act);return}const hit=e.target.closest('.match-position[data-token][data-seg]');if(hit)handleSegment(hit.dataset.token,hit.dataset.seg)});
el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.match-position[data-token][data-seg]')){e.preventDefault();handleSegment(e.target.dataset.token,e.target.dataset.seg)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderModal()}});
window.addEventListener('pagehide',()=>save());
render();
})();
</script>
</body>
</html>
